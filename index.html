<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Make Your Dog Talk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      z-index: 10;
    }

    #detection {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      z-index: 10;
      letter-spacing: 0.5px;
    }

    #error {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 16px;
      text-align: center;
      padding: 20px;
      z-index: 10;
      display: none;
    }

    #tap-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fff;
      font-family: -apple-system, sans-serif;
      cursor: pointer;
      user-select: none;
    }

    #tap-overlay .emoji {
      font-size: 72px;
      margin-bottom: 20px;
    }

    #tap-overlay .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    #tap-overlay .sub {
      font-size: 16px;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="status"></div>
  <div id="detection"></div>
  <div id="error"></div>

  <div id="tap-overlay">
    <div class="emoji">🐶</div>
    <div class="title">Make Your Dog Talk</div>
    <div class="sub">Tap anywhere to start</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd/dist/coco-ssd.min.js"></script>

  <script>
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const detectionEl = document.getElementById('detection');
    const errorEl = document.getElementById('error');
    const tapOverlay = document.getElementById('tap-overlay');

    // COCO-SSD class → sound filename in /sounds/
    const SOUND_MAP = {
      // Animals
      'person':       'person.mp3',
      'bird':         'bird.mp3',
      'cat':          'cat.mp3',
      'dog':          'dog.mp3',
      'horse':        'horse.mp3',
      'sheep':        'sheep.mp3',
      'cow':          'cow.mp3',
      'elephant':     'elephant.mp3',
      'bear':         'bear.mp3',

      // Vehicles
      'bicycle':      'bicycle.mp3',
      'car':          'car.mp3',
      'motorcycle':   'motorcycle.mp3',
      'airplane':     'airplane.mp3',
      'bus':          'bus.mp3',
      'train':        'train.mp3',
      'truck':        'truck.mp3',
      'boat':         'boat.mp3',

      // Electronics & furniture
      'tv':           'tv.mp3',
      'laptop':       'laptop.mp3',
      'mouse':        'mouse.mp3',
      'remote':       'remote.mp3',
      'keyboard':     'keyboard.mp3',
      'cell phone':   'cell-phone.mp3',
      'microwave':    'microwave.mp3',
      'clock':        'clock.mp3',
      'bed':          'bed.mp3',
      'book':         'book.mp3',

      // Home
      'toilet':       'toilet.mp3',
      'sink':         'sink.mp3',
      'scissors':     'scissors.mp3',
      'hair drier':   'hair-drier.mp3',

      // Drinkware & containers
      'bottle':       'bottle.mp3',
      'wine glass':   'wine-glass.mp3',
      'cup':          'wine-glass.mp3',
      'bowl':         'wine-glass.mp3',

      // Food — crunchy
      'apple':        'apple.mp3',
      'orange':       'apple.mp3',
      'broccoli':     'apple.mp3',
      'carrot':       'apple.mp3',

      // Food — eating
      'banana':       'eating.mp3',
      'sandwich':     'eating.mp3',
      'donut':        'eating.mp3',
      'cake':         'eating.mp3',

      // Food — hot/sizzly
      'hot dog':      'sizzle.mp3',
      'pizza':        'sizzle.mp3',

      // Sports
      'sports ball':  'sports-ball.mp3',
      'surfboard':    'surfboard.mp3',
      'tennis racket':'sports-ball.mp3',
    };

    const COOLDOWN_MS = 3000;
    let lastPlayedFile = null;
    let lastPlayedTime = 0;
    let currentAudio = null;
    let model = null;
    let detecting = false;
    let started = false;

    // Preload unique audio files only
    const audioCache = {};
    const uniqueFiles = [...new Set(Object.values(SOUND_MAP))];
    for (const file of uniqueFiles) {
      const audio = new Audio('sounds/' + file);
      audio.preload = 'auto';
      audioCache[file] = audio;
    }

    function playSound(cls) {
      const file = SOUND_MAP[cls];
      if (!file) return;

      const now = Date.now();
      const sameFile = file === lastPlayedFile;
      const inCooldown = (now - lastPlayedTime) < COOLDOWN_MS;
      if (sameFile && inCooldown) return;

      const audio = audioCache[file];
      if (!audio) return;

      if (currentAudio && !currentAudio.paused) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      audio.currentTime = 0;
      audio.play().catch(() => {});
      currentAudio = audio;
      lastPlayedFile = file;
      lastPlayedTime = now;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
          statusEl.textContent = 'Loading model...';
          loadModel();
        });
      } catch (err) {
        errorEl.style.display = 'block';
        if (err.name === 'NotAllowedError') {
          errorEl.textContent = 'Camera permission denied. Please allow camera access and reload.';
        } else if (err.name === 'NotFoundError') {
          errorEl.textContent = 'No camera found on this device.';
        } else {
          errorEl.textContent = 'Could not start camera: ' + err.message;
        }
      }
    }

    async function loadModel() {
      try {
        model = await cocoSsd.load();
        statusEl.textContent = 'Camera active';
        detecting = true;
        detectLoop();
      } catch (err) {
        statusEl.textContent = 'Model failed to load';
      }
    }

    async function detectLoop() {
      if (!detecting || !model) return;

      try {
        const predictions = await model.detect(video);
        if (predictions.length > 0) {
          const top = predictions[0];
          const confidence = Math.round(top.score * 100);
          detectionEl.textContent = top.class + ' (' + confidence + '%)';
          if (SOUND_MAP[top.class]) {
            playSound(top.class);
          }
        } else {
          detectionEl.textContent = '';
        }
      } catch (err) {
        // video not ready yet, skip frame
      }

      requestAnimationFrame(detectLoop);
    }

    tapOverlay.addEventListener('click', () => {
      if (started) return;
      started = true;
      tapOverlay.style.display = 'none';

      // iOS Safari requires audio to be triggered directly inside a user gesture.
      // Play+pause every sound file now to unlock them all.
      for (const audio of Object.values(audioCache)) {
        audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(() => {});
      }

      startCamera();
    });
  </script>
</body>
</html>
