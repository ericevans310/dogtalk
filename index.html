<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Make Your Dog Talk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      z-index: 10;
    }

    #detection {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      z-index: 10;
      letter-spacing: 0.5px;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #error {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 16px;
      text-align: center;
      padding: 20px;
      z-index: 10;
      display: none;
    }

    #tap-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fff;
      font-family: -apple-system, sans-serif;
      cursor: pointer;
      user-select: none;
    }

    #tap-overlay .emoji {
      font-size: 72px;
      margin-bottom: 20px;
    }

    #tap-overlay .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    #tap-overlay .sub {
      font-size: 16px;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="status"></div>
  <div id="detection"></div>
  <div id="error"></div>

  <div id="tap-overlay">
    <div class="emoji">🐶</div>
    <div class="title">Make Your Dog Talk</div>
    <div class="sub">Tap anywhere to start</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd/dist/coco-ssd.min.js"></script>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const statusEl = document.getElementById('status');
    const detectionEl = document.getElementById('detection');
    const errorEl = document.getElementById('error');
    const tapOverlay = document.getElementById('tap-overlay');

    function resizeCanvas() {
      overlay.width = window.innerWidth;
      overlay.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function drawGlow(bbox) {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      if (!bbox) return;

      const [bx, by, bw, bh] = bbox;
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const cw = overlay.width;
      const ch = overlay.height;

      // Match object-fit: cover scaling
      const scale = Math.max(cw / vw, ch / vh);
      const ox = (cw - vw * scale) / 2;
      const oy = (ch - vh * scale) / 2;

      const x = bx * scale + ox;
      const y = by * scale + oy;
      const w = bw * scale;
      const h = bh * scale;

      // Outer glow
      ctx.shadowColor = 'rgba(255, 220, 50, 1)';
      ctx.shadowBlur = 30;
      ctx.strokeStyle = 'rgba(255, 220, 50, 0.9)';
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);

      // Inner bright line (second pass reinforces the glow)
      ctx.shadowBlur = 10;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      // Corner accents
      const corner = Math.min(w, h) * 0.15;
      ctx.shadowBlur = 15;
      ctx.strokeStyle = 'rgba(255, 220, 50, 1)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      // top-left
      ctx.moveTo(x, y + corner); ctx.lineTo(x, y); ctx.lineTo(x + corner, y);
      // top-right
      ctx.moveTo(x + w - corner, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + corner);
      // bottom-right
      ctx.moveTo(x + w, y + h - corner); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - corner, y + h);
      // bottom-left
      ctx.moveTo(x + corner, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - corner);
      ctx.stroke();
    }

    // COCO-SSD class → fun label shown on screen
    const LABEL_MAP = {
      'person':        '👤 A human! Hello there!',
      'bicycle':       '🚲 A bicycle! Ding ding!',
      'car':           '🚗 Vroom! A car!',
      'motorcycle':    '🏍️ A motorcycle! So loud!',

      'bus':           '🚌 The bus is here!',
      'train':         '🚂 Choo choo! A train!',
      'truck':         '🚚 A big truck rumbling by!',
      'boat':          '⛵ A boat on the water!',
      'traffic light': '🚦 A traffic light!',
      'fire hydrant':  '🔴 A fire hydrant!',
      'stop sign':     '🛑 Stop right there!',
      'parking meter': '🅿️ A parking meter!',
      'bench':         '🪑 A bench to sit on!',
      'bird':          '🐦 A bird! Tweet tweet!',
      'cat':           '🐈 A cat! My nemesis!',
      'dog':           '🐕 Another dog! Woof woof!',
      'horse':         '🐎 A horse! So majestic!',
      'sheep':         '🐑 A fluffy sheep!',
      'cow':           '🐄 A cow! Moo!',
      'elephant':      '🐘 Whoa, an elephant!',
      'bear':          '🐻 A bear! Watch out!',
      'zebra':         '🦓 A zebra! Cool stripes!',
      'giraffe':       '🦒 A giraffe! So tall!',
      'backpack':      '🎒 A backpack full of stuff!',
      'umbrella':      '☂️ An umbrella for rainy days!',
      'handbag':       '👜 A fancy handbag!',
      'tie':           '👔 A fancy tie!',
      'suitcase':      '🧳 Going somewhere?',
      'frisbee':       '🥏 A frisbee! Fetch!',
      'skis':          '⛷️ Skis! Hit the slopes!',
      'snowboard':     '🏂 A snowboard! Shred it!',
      'sports ball':   '⚽ A ball! Let\'s play!',
      'kite':          '🪁 A kite flying high!',
      'baseball bat':  '⚾ A baseball bat!',
      'baseball glove':'🧤 A baseball glove!',
      'skateboard':    '🛹 A skateboard! Rad!',
      'surfboard':     '🏄 A surfboard! Hang ten!',
      'tennis racket': '🎾 A tennis racket!',
      'bottle':        '🍶 A bottle!',
      'wine glass':    '🍷 A wine glass! Clink!',
      'cup':           '☕ A cup! Hot stuff!',
      'fork':          '🍴 A fork!',
      'knife':         '🔪 A knife! Careful!',
      'spoon':         '🥄 A spoon!',
      'bowl':          '🥣 A bowl of something yummy!',
      'banana':        '🍌 A banana! Nom nom!',
      'apple':         '🍎 An apple a day!',
      'sandwich':      '🥪 A sandwich! Yummy!',
      'orange':        '🍊 A juicy orange!',
      'broccoli':      '🥦 Broccoli! Eat your greens!',
      'carrot':        '🥕 A crunchy carrot!',
      'hot dog':       '🌭 A hot dog! Sizzling!',
      'pizza':         '🍕 PIZZA! My favorite!',
      'donut':         '🍩 A donut! So sweet!',
      'cake':          '🎂 Cake! Is it a birthday?',
      'chair':         '🪑 A chair to sit on!',
      'couch':         '🛋️ A cozy couch!',
      'potted plant':  '🌿 A plant! Growing nicely!',
      'bed':           '🛏️ A bed! Naptime!',
      'dining table':  '🍽️ A dining table!',
      'toilet':        '🚽 The toilet! Relief!',
      'tv':            '📺 A TV! What\'s on?',
      'laptop':        '💻 A laptop! Clickety clack!',
      'mouse':         '🖱️ A computer mouse!',
      'remote':        '🎮 A remote control!',
      'keyboard':      '⌨️ A keyboard! Type type type!',
      'cell phone':    '📱 A phone! Is it ringing?',
      'microwave':     '📡 A microwave! Ding!',
      'oven':          '🍳 An oven! Something cooking!',
      'toaster':       '🍞 A toaster! Pop!',
      'sink':          '🚿 A sink! Running water!',
      'refrigerator':  '🧊 A fridge full of food!',

      'toothbrush':    '🪥 A toothbrush! Brush brush!',
    };

    // COCO-SSD class → sound filename (only classes with sounds >1s)
    const SOUND_MAP = {
      // Animals
      'person':        ['person.mp3', 'person-baby-cry.mp3', 'person-laugh.mp3', 'person-cough.mp3', 'person-applause.mp3', 'person-heartbeat.mp3', 'person-phone.mp3', 'crowd-cheer.mp3'],
      'bird':          'bird.mp3',
      'cat':           ['cat.mp3', 'cat-meow2.mp3', 'cat-meow3.mp3', 'cat-meow4.mp3', 'cat-meow5.mp3', 'cat-hiss.mp3', 'cat-purr.mp3', 'cat-growl.mp3', 'cat-street.mp3'],
      'dog':           ['dog.mp3', 'dog-bark2.mp3', 'dog-bark3.mp3', 'dog-puppy.mp3', 'dog-aggressive.mp3', 'dog-lively.mp3', 'dog-guard.mp3'],
      'horse':         'horse.mp3',
      'sheep':         'sheep.mp3',
      'cow':           'cow.mp3',
      'elephant':      'elephant.mp3',
      'bear':          'bear.mp3',

      // Vehicles
      'bicycle':       'bicycle.mp3',
      'car':           'car.mp3',
      'motorcycle':    'motorcycle.mp3',
      'airplane':      'airplane.mp3',
      'bus':           'bus.mp3',
      'train':         'train.mp3',
      'truck':         'truck.mp3',
      'boat':          'boat.mp3',

      // Electronics
      'tv':            'tv.mp3',
      'laptop':        'laptop.mp3',
      'keyboard':      'keyboard.mp3',
      'cell phone':    'cell-phone.mp3',
      'microwave':     'microwave.mp3',
      'clock':         'clock.mp3',
      'bed':           'bed.mp3',

      // Home
      'toilet':        'toilet.mp3',
      'sink':          'sink.mp3',
      'hair drier':    'hair-drier.mp3',

      // Drinkware & containers
      'bottle':        'bottle.mp3',
      'wine glass':    'wine-glass.mp3',
      'cup':           'bottle.mp3',

      // Food — crunchy
      'apple':         'apple.mp3',
      'orange':        'apple.mp3',
      'broccoli':      'apple.mp3',
      'carrot':        'apple.mp3',

      // Food — eating
      'banana':        'eating.mp3',
      'sandwich':      'eating.mp3',
      'donut':         'eating.mp3',
      'cake':          'eating.mp3',

      // Food — sizzly
      'hot dog':       'sizzle.mp3',
      'pizza':         'sizzle.mp3',

      // Sports
      'surfboard':     'surfboard.mp3',

      // Furniture
      'chair':         'chair.mp3',
      'couch':         'couch.mp3',
      'bed':           'bed.mp3',
      'dining table':  'eating.mp3',

      // Appliances
      'refrigerator':  'refrigerator.mp3',
      'toaster':       'toaster.mp3',
      'oven':          'microwave.mp3',

      // Misc
      'teddy bear':    'teddy-bear.mp3',
      'vase':          'glass-clink.mp3',
      'bowl':          'glass-clink.mp3',
      'fork':          'eating.mp3',
      'knife':         'eating.mp3',
      'spoon':         'eating.mp3',
    };

    const COOLDOWN_MS = 1000;
    let lastPlayedFile = null;
    let lastPlayedTime = 0;
    let currentSource = null;
    let isPlaying = false;
    let model = null;
    let detecting = false;
    let detectBusy = false;
    let started = false;

    // Web Audio API — created on tap so iOS trusts it from the start
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    const bufferCache = {};
    const allFiles = Object.values(SOUND_MAP).flat();
    const uniqueFiles = [...new Set(allFiles)];

    function pickFile(cls) {
      const entry = SOUND_MAP[cls];
      if (!entry) return null;
      if (typeof entry === 'string') return bufferCache[entry] ? entry : null;
      const available = entry.filter(f => bufferCache[f]);
      if (!available.length) return null;
      return available[Math.floor(Math.random() * available.length)];
    }

    function loadSounds() {
      for (const file of uniqueFiles) {
        fetch('sounds/' + file)
          .then(r => r.arrayBuffer())
          .then(buf => audioCtx.decodeAudioData(buf))
          .then(decoded => {
            if (decoded.duration >= 1) bufferCache[file] = decoded;
          })
          .catch(() => {});
      }
    }

    function playSound(cls) {
      if (!audioCtx || isPlaying) return;
      const file = pickFile(cls);
      if (!file) return;

      const now = Date.now();
      if (file === lastPlayedFile && (now - lastPlayedTime) < COOLDOWN_MS) return;

      const source = audioCtx.createBufferSource();
      source.buffer = bufferCache[file];
      source.connect(audioCtx.destination);
      source.onended = () => { isPlaying = false; currentSource = null; lastPlayedTime = Date.now(); };
      source.start(0);
      source.stop(audioCtx.currentTime + 3);
      isPlaying = true;
      currentSource = source;
      lastPlayedFile = file;
      lastPlayedTime = now;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
          statusEl.textContent = 'Loading model...';
          loadModel();
        });
      } catch (err) {
        errorEl.style.display = 'block';
        if (err.name === 'NotAllowedError') {
          errorEl.textContent = 'Camera permission denied. Please allow camera access and reload.';
        } else if (err.name === 'NotFoundError') {
          errorEl.textContent = 'No camera found on this device.';
        } else {
          errorEl.textContent = 'Could not start camera: ' + err.message;
        }
      }
    }

    async function loadModel() {
      try {
        model = await cocoSsd.load({ base: 'mobilenet_v2' });
        statusEl.textContent = 'Camera active';
        detecting = true;
        detectLoop();
      } catch (err) {
        statusEl.textContent = 'Model failed to load';
      }
    }

    async function detectLoop() {
      if (!detecting || !model) return;

      if (!detectBusy) {
        detectBusy = true;
        try {
          const predictions = await model.detect(video);
          if (predictions.length > 0) {
            const top = predictions[0];
            const confidence = Math.round(top.score * 100);
            const label = LABEL_MAP[top.class] || top.class;
            detectionEl.textContent = label + '  ' + confidence + '%';
            drawGlow(top.bbox);

            if (SOUND_MAP[top.class]) {
              playSound(top.class);
            }
          } else {
            detectionEl.textContent = '';
            drawGlow(null);
          }
        } catch (err) {
          // video not ready yet, skip frame
        }
        detectBusy = false;
      }

      requestAnimationFrame(detectLoop);
    }

    tapOverlay.addEventListener('click', () => {
      if (started) return;
      started = true;
      tapOverlay.style.display = 'none';

      // Create AudioContext inside user gesture — iOS trusts it immediately.
      audioCtx = new AudioContext();
      loadSounds();

      startCamera();
    });
  </script>
</body>
</html>
