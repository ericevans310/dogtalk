<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Make Your Dog Talk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    #status {
      position: fixed;
      top: 12px; left: 12px;
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      z-index: 10;
    }

    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #speech-bubble {
      position: fixed;
      background: #fff;
      color: #111;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: 800;
      max-width: 240px;
      min-width: 80px;
      text-align: center;
      pointer-events: none;
      z-index: 20;
      display: none;
      box-shadow: 0 4px 24px rgba(0,0,0,0.55);
      line-height: 1.35;
      letter-spacing: -0.2px;
    }
    #speech-bubble.above {
      transform: translateX(-50%) translateY(-100%);
      margin-top: -10px;
    }
    #speech-bubble.above::after {
      content: '';
      position: absolute;
      bottom: -12px; left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-top-color: #fff;
      border-bottom: none;
    }
    #speech-bubble.below {
      transform: translateX(-50%);
      margin-top: 10px;
    }
    #speech-bubble.below::after {
      content: '';
      position: absolute;
      top: -12px; left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-bottom-color: #fff;
      border-top: none;
    }

    #error {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 16px;
      text-align: center;
      padding: 20px;
      z-index: 10;
      display: none;
    }

    #tap-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fff;
      font-family: -apple-system, sans-serif;
      cursor: pointer;
      user-select: none;
    }
    #tap-overlay .emoji { font-size: 72px; margin-bottom: 20px; }
    #tap-overlay .title { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
    #tap-overlay .sub   { font-size: 16px; opacity: 0.75; }
  </style>
</head>

    // ── Canvas glow ──────────────────────────────────────────────────────────
    function drawGlow(bbox) {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      if (!bbox) return;
      const [bx, by, bw, bh] = bbox;
      const vw = video.videoWidth, vh = video.videoHeight;
      const cw = overlay.width,    ch = overlay.height;
      const scale = Math.max(cw / vw, ch / vh);
      const ox = (cw - vw * scale) / 2;
      const oy = (ch - vh * scale) / 2;
      const x = bx * scale + ox, y = by * scale + oy;
      const w = bw * scale,       h = bh * scale;

      ctx.shadowColor = 'rgba(255,220,50,1)';
      ctx.shadowBlur = 30;
      ctx.strokeStyle = 'rgba(255,220,50,0.9)';
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);
      ctx.shadowBlur = 10;
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      const corner = Math.min(w, h) * 0.15;
      ctx.shadowBlur = 15;
      ctx.strokeStyle = 'rgba(255,220,50,1)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, y + corner); ctx.lineTo(x, y); ctx.lineTo(x + corner, y);
      ctx.moveTo(x + w - corner, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + corner);
      ctx.moveTo(x + w, y + h - corner); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - corner, y + h);
      ctx.moveTo(x + corner, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - corner);
      ctx.stroke();
    }

    // ── Speech bubble ─────────────────────────────────────────────────────────
    function showBubble(text, bbox) {
      if (!text || !bbox) { bubbleEl.style.display = 'none'; return; }
      const [bx, by, bw, bh] = bbox;
      const vw = video.videoWidth, vh = video.videoHeight;
      const cw = overlay.width,    ch = overlay.height;
      const scale = Math.max(cw / vw, ch / vh);
      const ox = (cw - vw * scale) / 2;
      const oy = (ch - vh * scale) / 2;

      const screenX   = bx * scale + ox + (bw * scale) / 2;
      const bboxTop   = by * scale + oy;
      const bboxBot   = (by + bh) * scale + oy;
      const clampedX  = Math.max(130, Math.min(cw - 130, screenX));

      bubbleEl.textContent = text;
      bubbleEl.style.left  = clampedX + 'px';

      if (bboxTop > 120) {
        bubbleEl.className  = 'above';
        bubbleEl.style.top  = bboxTop + 'px';
      } else {
        bubbleEl.className  = 'below';
        bubbleEl.style.top  = bboxBot + 'px';
      }
      bubbleEl.style.display = 'block';
    }

      // Food — eating
      'banana':        'eating.mp3',
      'sandwich':      'eating.mp3',
      'donut':         'eating.mp3',
      'cake':          'eating.mp3',
      'hot dog':       'eating.mp3',
      'fork':          'eating.mp3',
      'knife':         'eating.mp3',
      'spoon':         'eating.mp3',
      'dining table':  'eating.mp3',

      // Food — sizzly
      'pizza':         'sizzle.mp3',

      // Sports
      'surfboard':     'surfboard.mp3',
      'sports ball':   'apple.mp3',
      'baseball bat':  'baseball-bat.mp3',
      'tennis racket': 'tennis-hit.mp3',
      'frisbee':       'dog-lively.mp3',

      // Furniture
      'chair':         'chair.mp3',
      'couch':         'couch.mp3',
      'bed':           'bed.mp3',

      // Appliances
      'refrigerator':  'refrigerator.mp3',
      'toaster':       'toaster.mp3',
      'oven':          'microwave.mp3',

      // Misc
      'teddy bear':    'teddy-bear.mp3',
      'backpack':      'dog-puppy.mp3',
      'suitcase':      'dog-puppy.mp3',
    };

    // ── Audio ─────────────────────────────────────────────────────────────────
    const COOLDOWN_MS = 1000;
    let lastPlayedFile = null, lastPlayedTime = 0;
    let currentSource = null, isPlaying = false;

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    const bufferCache = {};
    const uniqueFiles = [...new Set(Object.values(SOUND_MAP).flat())];

    function loadSounds() {
      for (const file of uniqueFiles) {
        fetch('sounds/' + file)
          .then(r => r.arrayBuffer())
          .then(buf => audioCtx.decodeAudioData(buf))
          .then(decoded => { if (decoded.duration >= 1) bufferCache[file] = decoded; })
          .catch(() => {});
      }
    }

    function pickFile(cls) {
      const entry = SOUND_MAP[cls];
      if (!entry) return null;
      const files = typeof entry === 'string' ? [entry] : entry;
      const avail = files.filter(f => bufferCache[f]);
      return avail.length ? avail[Math.floor(Math.random() * avail.length)] : null;
    }

    function playSound(cls) {
      if (!audioCtx || isPlaying) return;
      const file = pickFile(cls);
      if (!file) return;
      const now = Date.now();
      if (file === lastPlayedFile && (now - lastPlayedTime) < COOLDOWN_MS) return;

      const buf = bufferCache[file];
      // Start at a random point within the first 2s for long sounds — adds variety
      const maxOffset = buf.duration > 4 ? Math.min(2, buf.duration - 3) : 0;
      const startOffset = maxOffset > 0 ? Math.random() * maxOffset : 0;

      const source = audioCtx.createBufferSource();
      source.buffer = buf;
      source.connect(audioCtx.destination);
      source.onended = () => { isPlaying = false; currentSource = null; lastPlayedTime = Date.now(); };
      source.start(0, startOffset);
      source.stop(audioCtx.currentTime + 3);
      isPlaying = true;
      currentSource = source;
      lastPlayedFile = file;
      lastPlayedTime = now;
    }

    // ── Detection — rolling vote window ──────────────────────────────────────
    const VOTE_WINDOW  = 7;
    const VOTE_THRESH  = 4;  // need ≥4 of 7 frames to commit
    const MIN_CONF     = 0.38;

    let voteBuffer  = [];   // last N { cls, bbox } or null
    let activeClass = null;
    let activeBbox  = null;
    let activeQuote = null;

    let model = null, detecting = false, detectBusy = false, started = false;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => { statusEl.textContent = 'Loading model...'; loadModel(); });
      } catch (err) {
        errorEl.style.display = 'block';
        errorEl.textContent = err.name === 'NotAllowedError' ? 'Camera permission denied.' :
                              err.name === 'NotFoundError'   ? 'No camera found.'          :
                              'Could not start camera: ' + err.message;
      }
    }

    async function loadModel() {
      try {
        model = await cocoSsd.load({ base: 'mobilenet_v2' });
        statusEl.textContent = 'Camera active';
        detecting = true;
        detectLoop();
      } catch { statusEl.textContent = 'Model failed to load'; }
    }

    async function detectLoop() {
      if (!detecting || !model) return;
      if (!detectBusy) {
        detectBusy = true;
        try {
          const preds = await model.detect(video);
          const best  = preds.filter(p => p.score >= MIN_CONF)[0] || null;

          // Push to rolling window
          voteBuffer.push(best ? { cls: best.class, bbox: best.bbox } : null);
          if (voteBuffer.length > VOTE_WINDOW) voteBuffer.shift();

          // Count votes
          const counts = {};
          for (const v of voteBuffer) if (v) counts[v.cls] = (counts[v.cls] || 0) + 1;
          const winner = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || null;

          if (winner && counts[winner] >= VOTE_THRESH) {
            const changed = winner !== activeClass;
            activeClass = winner;
            // Use the freshest bbox we have for the winning class
            const fresh = [...voteBuffer].reverse().find(v => v && v.cls === winner);
            if (fresh) activeBbox = fresh.bbox;
            if (changed) activeQuote = pickQuote(winner);

            drawGlow(activeBbox);
            showBubble(activeQuote, activeBbox);
            if (SOUND_MAP[activeClass]) playSound(activeClass);
          } else {
            // No consensus yet — show raw glow but no bubble
            drawGlow(best?.bbox || null);
            if (!isPlaying) {
              activeClass = null;
              activeQuote = null;
              showBubble(null, null);
            }
          }
        } catch { /* frame not ready */ }
        detectBusy = false;
      }
      requestAnimationFrame(detectLoop);
    }

    // ── Tap to start ──────────────────────────────────────────────────────────
    tapOverlay.addEventListener('click', () => {
      if (started) return;
      started = true;
      tapOverlay.style.display = 'none';
      audioCtx = new AudioCtx();
      loadSounds();
      startCamera();
    });
  </script>
</body>
</html>
